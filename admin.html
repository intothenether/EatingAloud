<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Living to eat - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <img src="resources/images/EatingAloudLogoDark.svg" alt="Living to eat logo" class="brand-logo" />
        <div class="brand-title">
          <span>Living</span>
          <strong>to eat</strong>
        </div>
      </div>
      <nav class="desktop-menu">
        <ul>
          <li><a href="index.html">Back to Site</a></li>
        </ul>
      </nav>
      <button id="menu-toggle" class="menu-toggle" aria-label="Toggle Navigation">
        <span></span><span></span><span></span>
      </button>
      <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile Navigation">
        <a href="index.html">Home</a>
        <a href="#posts">Stories</a>
        <a href="about.html">About us</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <main class="admin-main">
      <h1>Blog Post CMS</h1>
      <div id="login-form">
        <form id="auth-form">
          <label for="password">Password:</label>
          <input type="password" id="password" required>
          <button type="submit">Login</button>
        </form>
      </div>
      <div id="cms-content" class="hidden">
        <h2>Add New Post</h2>
        <form id="new-post-form">
          <input type="hidden" id="post-id">

          <label for="post-title">Title:</label>
          <input type="text" id="post-title" required>

          <label for="post-image">Cover image URL:</label>
          <input type="url" id="post-image" placeholder="https://example.com/image.jpg">

          <label for="post-image-file">Upload cover image:</label>
          <input type="file" id="post-image-file" accept="image/*">

          <label for="post-publish-date">Publish date:</label>
          <input type="date" id="post-publish-date">

          <fieldset class="form-section">
            <legend>Review</legend>
            <label>
              <input type="checkbox" id="post-review-checkbox">
              Mark this post as a review
            </label>
            <label for="post-review-rating">Stars:</label>
            <select id="post-review-rating">
              <option value="5">★★★★★</option>
              <option value="4">★★★★☆</option>
              <option value="3">★★★☆☆</option>
              <option value="2">★★☆☆☆</option>
              <option value="1">★☆☆☆☆</option>
            </select>
          </fieldset>

          <fieldset class="form-section emoji-section">
            <legend>Emoji picker</legend>
            <div id="emoji-picker" class="emoji-picker"></div>
            <label for="custom-emoji">Add custom emoji:</label>
            <div class="emoji-input-row">
              <input type="text" id="custom-emoji" placeholder="e.g. 🍜">
              <button type="button" id="add-custom-emoji">Add</button>
            </div>
          </fieldset>

          <label for="post-content">Content:</label>
          <textarea id="post-content" required></textarea>

          <label for="post-inline-image-file">Upload inline image:</label>
          <input type="file" id="post-inline-image-file" accept="image/*">
          <small>Uploaded images are inserted directly into post text.</small>

          <fieldset class="form-section">
            <legend>Recipe (optional)</legend>
            <label for="post-recipe-ingredients">Ingredients (one per line):</label>
            <textarea id="post-recipe-ingredients" placeholder="300g flour\n1 cup milk\n2 eggs"></textarea>
            <label for="post-recipe-steps">Steps (one per line):</label>
            <textarea id="post-recipe-steps" placeholder="Mix flour and milk\nAdd eggs\nBake for 25 minutes"></textarea>
          </fieldset>

          <fieldset class="form-section">
            <legend>Map location (optional)</legend>
            <label for="post-location-name">Location name:</label>
            <input type="text" id="post-location-name" placeholder="Farang">
            <label for="post-location-address">Address:</label>
            <input type="text" id="post-location-address" placeholder="Ringvägen 100, Stockholm">
            <label for="post-location-lat">Latitude:</label>
            <input type="number" id="post-location-lat" step="any" placeholder="59.338">
            <label for="post-location-lng">Longitude:</label>
            <input type="number" id="post-location-lng" step="any" placeholder="18.071">
          </fieldset>

          <button type="submit">Add Post</button>
          <button type="button" id="cancel-edit" class="secondary hidden">Cancel</button>
        </form>
        
        <h2>Existing Posts</h2>
        <div id="existing-posts"></div>
      </div>
    </main>

    <script type="module" src="scripts/dist/main.js"></script>
    <script type="module" src="scripts/dist/admin.js"></script>
  </body>
</html>
